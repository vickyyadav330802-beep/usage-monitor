name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o android.zip -d extracted
          if [ -d "extracted/android" ]; then
            mv extracted/android android_project
          else
            mv extracted android_project
          fi

      - name: Make Gradle executable
        run: chmod +x android_project/gradlew

      - name: Build APK
        working-directory: android_project
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Usage-Monitor-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
